services:
  - type: web
    name: metaquant-forge
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: META_API_KEY
        sync: false
      - key: META_API_BASE_URL
        value: https://api.fireworks.ai/inference/v1
      - key: META_MODEL
        value: accounts/fireworks/models/llama-v3p3-70b-instruct
